[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "terroir-onto"
version = "0.1.0"
description = "Companion code for 'Terroir Has No Equivalent Class': ontology alignment when a concept has no equivalent."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "bdot" }]
dependencies = [
    "rdflib>=7.0",
    "owlrl>=7.0",
    "pyshacl>=0.26",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
terroir-onto = "terroir_onto.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
