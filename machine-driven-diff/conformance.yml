name: conformance

on: [push, pull_request]

jobs:
  spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - name: Run the conformance suite
        env:
          OSSS_IMPL: reference
        run: python -m pytest conformance -v
